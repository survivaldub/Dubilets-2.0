# SurvivaldubCore

#Configuración de la base de datos / Database configuration
database:
  host: "localhost"  # Dirección del servidor MySQL
  port: 3306         # Puerto del servidor MySQL
  name: "name"
  user: "username"
  password: "password"  # Contraseña del servidor MySQL
  ssl: false

custom-name: "example"
dubilets:
  enable: false
  win-percent-kill: 0
  locations: []
  prizes: []
